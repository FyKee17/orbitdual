<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070B; --panel:#0F0F16; --panel-2:#14141D; --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.15); --white:#F2F2F7; --muted:#9595A6; --dim:#5E5E6B;
  --accent:#7B61FF; --accent-soft:#A48CFF; --ok:#6FCB85; --warn:#E8A55C; --bad:#E36B7A;
  --cy:#5FC8E0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--white);font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55;overflow:hidden}
button,a,input,select,textarea{font:inherit;color:inherit}
button,a{background:none;border:0;cursor:pointer;text-decoration:none}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.sm{width:14px;height:14px}
h1,h2,h3,h4{font-family:'Space Grotesk';font-weight:600;letter-spacing:-.015em;line-height:1.25}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}

#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);
  text-align:center;gap:14px;padding:30px}
#gate .ring{width:44px;height:44px;border-radius:50%;border:2px solid rgba(123,97,255,.25);
  border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
#gate.gone{opacity:0;pointer-events:none;transition:opacity .4s}

.shell{display:flex;height:100vh}
aside{width:232px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;
  background:var(--panel);overflow-y:auto}
.ahd{display:flex;align-items:center;gap:9px;padding:15px 16px;border-bottom:1px solid var(--line)}
.ahd img{width:24px}
.ahd b{font-family:'Space Grotesk';font-size:.95rem}
.ahd i{font-style:normal;font-family:'JetBrains Mono';font-size:.58rem;letter-spacing:.1em;
  color:var(--accent-soft);border:1px solid rgba(123,97,255,.35);border-radius:5px;padding:1px 5px;margin-left:auto}
nav{padding:10px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
nav h5{font-family:'Space Grotesk';font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);padding:12px 10px 6px}
nav button{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  font-size:.84rem;color:var(--muted);transition:.16s;text-align:left;width:100%}
nav button:hover{background:rgba(255,255,255,.05);color:#fff}
nav button.on{background:rgba(123,97,255,.16);color:#fff}
nav button .pill{margin-left:auto;font-size:.65rem;background:var(--bad);color:#fff;
  border-radius:99px;padding:1px 6px;font-weight:600}
.aft{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:.76rem;color:var(--dim)}
.aft a{color:var(--muted)}.aft a:hover{color:#fff}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.mhd{flex:none;display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
.mhd h1{font-size:1.06rem}
.mhd .sp{margin-left:auto}
.mbody{flex:1;overflow-y:auto;padding:22px}
.wrap{max-width:1180px;margin:0 auto}

.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;font-size:.81rem;
  border:1px solid var(--line);transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:rgba(255,255,255,.05)}
.btn.p{background:var(--accent);border-color:transparent;font-weight:600}
.btn.p:hover{background:var(--accent-soft)}
.btn.d{color:#F3A2AC;border-color:rgba(227,107,122,.3)}
.btn.d:hover{background:rgba(227,107,122,.14)}
.btn.sm{padding:5px 10px;font-size:.75rem}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;font-size:.83rem;color:#fff;transition:.18s}
.inp:focus{outline:none;border-color:rgba(123,97,255,.55);background:rgba(255,255,255,.06)}
select.inp{cursor:pointer}
select.inp option{background:#15151E}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.kc{border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:var(--panel);
  transition:.25s;position:relative;overflow:hidden}
.kc:hover{border-color:var(--line-2);transform:translateY(-2px)}
.kc .lb{font-size:.72rem;color:var(--dim);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.kc b{font-family:'Space Grotesk';font-size:1.62rem;display:block;line-height:1.05;letter-spacing:-.02em}
.kc .sub{font-size:.71rem;color:var(--muted);margin-top:5px}
.kc.good b{color:var(--ok)} .kc.bad b{color:var(--bad)} .kc.acc b{color:var(--accent-soft)}

.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;margin-bottom:18px}
.ph{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line)}
.ph h3{font-size:.92rem}
.ph .sp{margin-left:auto}
.pb{padding:17px}
.pb.flush{padding:0}

table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:rgba(255,255,255,.03);font-weight:600;font-size:.74rem;color:var(--muted);
  letter-spacing:.03em;position:sticky;top:0;z-index:2}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:'JetBrains Mono';font-size:.78rem}
.tscroll{overflow:auto;max-height:520px}
.mail{color:var(--muted);font-size:.76rem}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;padding:2px 8px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:rgba(111,203,133,.3);background:rgba(111,203,133,.08)}
.tag.warn{color:var(--warn);border-color:rgba(232,165,92,.3);background:rgba(232,165,92,.08)}
.tag.bad{color:var(--bad);border-color:rgba(227,107,122,.3);background:rgba(227,107,122,.08)}
.tag.acc{color:var(--accent-soft);border-color:rgba(123,97,255,.3);background:rgba(123,97,255,.1)}
.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:.83rem}

/* gráfico */
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding:8px 2px 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;align-items:center;
  height:100%;position:relative}
.bar .b{width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--accent-soft),var(--accent));
  min-height:3px;transition:height .5s cubic-bezier(.2,.8,.3,1),filter .16s}
.bar:hover .b{filter:brightness(1.35)}
.bar .d{font-size:.6rem;color:var(--dim);font-family:'JetBrains Mono'}
.bar .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#1C1C27;border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;font-size:.7rem;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.16s;z-index:5}
.bar:hover .tip{opacity:1}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.split{grid-template-columns:1fr}}

.drawer{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-end}
.drawer .bg{position:absolute;inset:0;background:rgba(5,5,9,.65);backdrop-filter:blur(3px);animation:fd .2s}
.dcard{position:relative;width:min(620px,100%);height:100%;background:var(--panel-2);
  border-left:1px solid var(--line-2);display:flex;flex-direction:column;animation:sl .32s cubic-bezier(.2,.9,.3,1)}
@keyframes sl{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.dhd{flex:none;display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dbody{flex:1;overflow-y:auto;padding:20px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:600;
  background:linear-gradient(140deg,var(--accent),#4A36AF);color:#fff}

.ovl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(5,5,9,.7);backdrop-filter:blur(4px);animation:fd .2s}
.mdl{width:min(440px,100%);background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:18px;padding:22px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mdl h3{font-size:1.02rem;margin-bottom:6px}
.mdl p{color:var(--muted);font-size:.83rem;margin-bottom:15px}
.mdl label{display:block;font-size:.74rem;color:var(--muted);margin:11px 0 5px}
.mdl .inp{width:100%}
.mdl .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.fld{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:0}
.fld .fl{flex:1;min-width:0}
.fld .fl b{display:block;font-size:.84rem;margin-bottom:2px}
.fld .fl span{font-size:.75rem;color:var(--muted)}
.sw{width:40px;height:23px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;
  transition:.2s;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:.2s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--accent)}.sw.on::after{left:20px}

.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;
  flex-direction:column;gap:8px;align-items:center}
.tst{background:#1B1B26;border:1px solid var(--line-2);border-radius:11px;padding:9px 15px;
  font-size:.82rem;box-shadow:0 14px 34px -12px rgba(0,0,0,.8);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  aside{position:fixed;z-index:50;height:100%;transform:translateX(-100%);transition:.28s}
  aside.open{transform:none}
  .mhd .burger{display:flex!important}
}
.burger{display:none}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
const sb = createClient('https://vbjtqwflriyueqpcltqc.supabase.co',
  'sb_publishable_qPpQZNv3WQE2dI126isv0Q_r_kZCwpY',
  { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' } });

const $ = s => document.querySelector(s);
const esc = t => String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const n0 = v => Math.round(Number(v)||0).toLocaleString('pt-BR');
const n2 = v => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl = c => ((Number(c)||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const usd = v => 'US$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt  = s => s ? new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const dia = s => s ? new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';

function toast(m){
  const e = document.createElement('div'); e.className='tst'; e.textContent=m;
  $('#toasts').appendChild(e); setTimeout(()=>{ e.style.opacity=0; setTimeout(()=>e.remove(),300); }, 2600);
}

const SECOES = [
  {g:'Panorama'},
  {id:'geral',   nm:'Visão geral', ic:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>'},
  {id:'fin',     nm:'Financeiro',  ic:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>'},
  {g:'Operação'},
  {id:'users',   nm:'Usuários',    ic:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0M17 11a3 3 0 100-6M22 21a5.5 5.5 0 00-4-5.3"/>'},
  {id:'planos',  nm:'Planos',      ic:'<path d="M12 3l2.6 5.6 6.4.8-4.7 4.3 1.3 6.3L12 17l-5.6 3 1.3-6.3L3 9.4l6.4-.8z"/>'},
  {id:'oc',      nm:'Créditos e consumo', ic:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10h4.5a2 2 0 010 4H9"/>'},
  {id:'modelos', nm:'Modelos',     ic:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/>'},
  {g:'Suporte'},
  {id:'feed',    nm:'Feedback e tickets', ic:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>', badge:'fb'},
  {id:'logs',    nm:'Logs e auditoria', ic:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'}
];

let OV = null, ME = null, atual = 'geral';

function renderNav(){
  $('#nav').innerHTML = SECOES.map(s=> s.g
    ? `<h5>${s.g}</h5>`
    : `<button data-s="${s.id}" class="${s.id===atual?'on':''}">
        <svg class="sm" viewBox="0 0 24 24">${s.ic}</svg>${s.nm}
        ${s.badge==='fb' && OV && OV.feedback_aberto ? `<span class="pill">${OV.feedback_aberto}</span>`:''}
      </button>`).join('');
  $('#nav').querySelectorAll('[data-s]').forEach(b=> b.addEventListener('click', ()=>{
    atual = b.dataset.s; $('#side').classList.remove('open'); draw();
  }));
}

/* ============ VIEWS ============ */
async function draw(){
  renderNav();
  const s = SECOES.find(x=>x.id===atual);
  $('#ttl').textContent = s ? s.nm : '';
  const v = $('#view');
  v.innerHTML = `<div class="empty">Carregando…</div>`;
  try{
    if(atual==='geral')   v.innerHTML = await viewGeral();
    if(atual==='fin')     v.innerHTML = await viewFin();
    if(atual==='users')   { v.innerHTML = await viewUsers(); wireUsers(); }
    if(atual==='planos')  { v.innerHTML = await viewPlanos(); wirePlanos(); }
    if(atual==='oc')      { v.innerHTML = await viewOC(); }
    if(atual==='modelos') { v.innerHTML = await viewModelos(); wireModelos(); }
    if(atual==='feed')    { v.innerHTML = await viewFeed(); wireFeed(); }
    if(atual==='logs')    v.innerHTML = await viewLogs();
  }catch(e){
    v.innerHTML = `<div class="panel"><div class="empty">Não consegui carregar: ${esc(e.message||e)}</div></div>`;
  }
  document.querySelectorAll('.mbody').forEach(m=>m.scrollTop=0);
}

async function loadOverview(force){
  if(OV && !force) return OV;
  const { data, error } = await sb.rpc('admin_overview');
  if(error) throw error;
  OV = data; return OV;
}

function grafico(serie, campo, cor, fmtv){
  const max = Math.max(1, ...serie.map(d=>Number(d[campo])||0));
  return `<div class="chart">${serie.map(d=>{
    const val = Number(d[campo])||0;
    const h = Math.max(2, val/max*100);
    const [,mm,dd] = d.dia.split('-');
    return `<div class="bar"><span class="tip">${dd}/${mm} · ${fmtv(val)}</span>
      <span class="b" style="height:${h}%;${cor?`background:${cor}`:''}"></span>
      <span class="d">${dd}</span></div>`;
  }).join('')}</div>`;
}

async function viewGeral(){
  const o = await loadOverview(true);
  const tk = o.tokens_mes||{};
  return `
  <div class="cards">
    <div class="kc"><div class="lb"><svg class="sm" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0114 0"/></svg>Usuários</div>
      <b>${n0(o.usuarios_total)}</b><div class="sub">${n0(o.usuarios_30d)} novos em 30 dias</div></div>
    <div class="kc good"><div class="lb"><svg class="sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Ativos (7d)</div>
      <b>${n0(o.ativos_7d)}</b><div class="sub">entraram na última semana</div></div>
    <div class="kc acc"><div class="lb"><svg class="sm" viewBox="0 0 24 24"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>MRR</div>
      <b>${brl(o.mrr_cents)}</b><div class="sub">receita recorrente mensal</div></div>
    <div class="kc"><div class="lb"><svg class="sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10h4.5a2 2 0 010 4H9"/></svg>OC no mês</div>
      <b>${n0(o.oc_mes)}</b><div class="sub">${n0(tk.entrada)} in · ${n0(tk.saida)} out</div></div>
    <div class="kc ${Number(o.usd_mes) > Number(o.mrr_cents)/100/5.5 ? 'bad':''}">
      <div class="lb"><svg class="sm" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Custo de API</div>
      <b>${usd(o.usd_mes)}</b><div class="sub">estimado no mês</div></div>
    <div class="kc ${o.erros_24h?'bad':''}"><div class="lb"><svg class="sm" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>Erros (24h)</div>
      <b>${n0(o.erros_24h)}</b><div class="sub">falhas de chamada à IA</div></div>
  </div>

  <div class="panel"><div class="ph"><h3>Consumo dos últimos 14 dias</h3>
    <span class="sp"></span><span class="tag acc">OC debitados</span></div>
    <div class="pb">${grafico(o.serie_14d,'oc','', v=>n0(v)+' OC')}</div></div>

  <div class="split">
    <div class="panel"><div class="ph"><h3>Usuários por plano</h3></div>
      <div class="pb flush"><table><thead><tr><th>Plano</th><th class="num">Usuários</th><th class="num">Receita</th></tr></thead>

async function viewFin(){
  const o = await loadOverview();
  const receita = Number(o.mrr_cents)/100;
  const custo = Number(o.usd_mes) * 5.5;            // conversão aproximada
  const margem = receita - custo;
  const pct = receita > 0 ? (margem/receita*100) : 0;
  const pagantes = (o.por_plano||[]).filter(p=>p.price_cents>0).reduce((a,p)=>a+Number(p.usuarios),0);
  const { count: cancel } = await sb.from('user_subscriptions')
    .select('user_id',{count:'exact',head:true}).neq('status','active');
  const churn = pagantes ? (Number(cancel||0)/(pagantes+Number(cancel||0))*100) : 0;

  return `
  <div class="cards">
    <div class="kc acc"><div class="lb">MRR</div><b>${brl(o.mrr_cents)}</b>
      <div class="sub">${n0(pagantes)} assinantes pagantes</div></div>
    <div class="kc"><div class="lb">Custo de API (mês)</div><b>${usd(o.usd_mes)}</b>
      <div class="sub">≈ R$ ${n2(custo)} a R$ 5,50/US$</div></div>
    <div class="kc ${margem>=0?'good':'bad'}"><div class="lb">Margem</div>
      <b>R$ ${n2(margem)}</b><div class="sub">${pct.toFixed(0)}% da receita</div></div>
    <div class="kc ${churn>8?'bad':''}"><div class="lb">Churn</div><b>${churn.toFixed(1)}%</b>
      <div class="sub">assinaturas não ativas</div></div>
    <div class="kc"><div class="lb">ARPU</div>
      <b>${pagantes? brl(Number(o.mrr_cents)/pagantes) : 'R$ 0'}</b>
      <div class="sub">receita média por pagante</div></div>
  </div>

  <div class="panel"><div class="ph"><h3>Custo diário de API (14 dias)</h3>
    <span class="sp"></span><span class="tag warn">estimativa</span></div>
    <div class="pb">${grafico(o.serie_14d,'usd','linear-gradient(180deg,#E8A55C,#C97C34)', v=>usd(v))}</div></div>

  <div class="panel"><div class="ph"><h3>Receita por plano</h3></div><div class="pb flush">
    <table><thead><tr><th>Plano</th><th class="num">Preço</th><th class="num">Assinantes</th>
      <th class="num">Receita/mês</th><th class="num">% do MRR</th></tr></thead><tbody>
      ${(o.por_plano||[]).map(p=>{
        const r = Number(p.price_cents)*Number(p.usuarios);
        return `<tr><td><b>${esc(p.name)}</b></td><td class="num">${p.price_cents?brl(p.price_cents):'grátis'}</td>
        <td class="num">${n0(p.usuarios)}</td><td class="num">${r?brl(r):'—'}</td>
        <td class="num">${Number(o.mrr_cents)? (r/Number(o.mrr_cents)*100).toFixed(0)+'%' : '—'}</td></tr>`;
      }).join('')}</tbody></table></div></div>

  <div class="panel"><div class="ph"><h3>Como ler a margem</h3></div><div class="pb">
    <p style="font-size:.84rem;color:var(--muted);line-height:1.7">
      O custo de API vem dos tokens reais de cada resposta multiplicados pelo preço por token que está
      cadastrado em <b>Modelos</b>. Se a margem ficar apertada, a saída não é subir o preço do plano:
      é ajustar os multiplicadores de OC, na mesma tela — assim o consumo passa a refletir melhor
      o custo real sem mexer no que o cliente paga.</p>
  </div></div>`;
}

async function acao(id, action, value, drawer, msg){
  const { data, error } = await sb.rpc('admin_action', {p_action:action, p_user:id, p_value:value});
  if(error || (data&&data.error)){ toast('Não deu certo: '+(error?.message||data.error)); return; }
  toast(msg||'Feito.'); drawer && drawer.remove(); OV = null; draw();
}
function dialog(html, onOk){
  const o = document.createElement('div'); o.className='ovl';
  o.innerHTML = `<div class="mdl">${html}</div>`;
  document.body.appendChild(o);
  o.addEventListener('click', e=>{
    if(e.target===o || e.target.closest('[data-c]')) return o.remove();
    if(e.target.closest('[data-ok]')) onOk(o);
  });
  return o;
}

async function viewModelos(){
  const { data:ms } = await sb.from('model_config').select('*').order('sort');
  const { data:st } = await sb.from('app_settings').select('*');
  const sset = Object.fromEntries((st||[]).map(s=>[s.key, s.value]));
  return `
  <div class="panel"><div class="ph"><h3>Modelos</h3><span class="sp"></span>
    <span class="tag">os multiplicadores valem na hora, sem redeploy</span></div><div class="pb">
    ${(ms||[]).map(m=>`<div style="border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px" data-mc="${m.id}">
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px">
        <b style="font-family:'Space Grotesk';font-size:1rem">${esc(m.display_name)}</b>
        <span class="tag ${m.enabled?'ok':'bad'}">${m.enabled?'ligado':'desligado'}</span>
        <span class="sp" style="margin-left:auto"></span>
        <span class="sw ${m.enabled?'on':''}" data-f="enabled"></span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px">
        <label style="font-size:.73rem;color:var(--muted)">Modelo real da API
          <input class="inp" data-f="api_model" value="${esc(m.api_model)}" style="width:100%;margin-top:4px"></label>
        <label style="font-size:.73rem;color:var(--muted)">OC por 1k entrada
          <input class="inp" data-f="oc_in" value="${m.oc_per_1k_in}" style="width:100%;margin-top:4px"></label>
        <label style="font-size:.73rem;color:var(--muted)">OC por 1k saída
          <input class="inp" data-f="oc_out" value="${m.oc_per_1k_out}" style="width:100%;margin-top:4px"></label>
        <label style="font-size:.73rem;color:var(--muted)">US$ por Mtok entrada
          <input class="inp" data-f="usd_in" value="${m.usd_per_mtok_in}" style="width:100%;margin-top:4px"></label>
        <label style="font-size:.73rem;color:var(--muted)">US$ por Mtok saída
          <input class="inp" data-f="usd_out" value="${m.usd_per_mtok_out}" style="width:100%;margin-top:4px"></label>
        <label style="font-size:.73rem;color:var(--muted)">max_tokens
          <input class="inp" data-f="max_tokens" value="${m.max_tokens}" style="width:100%;margin-top:4px"></label>
      </div>
      <label style="font-size:.73rem;color:var(--muted);display:block;margin-top:11px">Aviso quando desligado
        <input class="inp" data-f="offline_note" value="${esc(m.offline_note||'')}"
          placeholder="Ex.: em manutenção, volta em 1h" style="width:100%;margin-top:4px"></label>
      <div style="margin-top:13px"><button class="btn p sm" data-savem="${m.id}">Salvar ${esc(m.display_name)}</button></div>
    </div>`).join('')}
  </div></div>

  <div class="panel"><div class="ph"><h3>Configurações gerais</h3></div><div class="pb">
    <div class="fld"><div class="fl"><b>Créditos acumulam de um ciclo para o outro</b>
      <span>Se ficar desligado, o saldo zera e volta cheio a cada renovação.</span></div>
      <span class="sw ${String(sset.credits_rollover)==='true'?'on':''}" data-set="credits_rollover"></span></div>
    <div class="fld"><div class="fl"><b>Alerta de uso anômalo</b>
      <span>Quantas vezes acima da média de 7 dias para alguém aparecer na lista de anomalias.</span></div>
      <input class="inp" id="anom" value="${esc(sset.anomaly_multiplier ?? 3)}" style="width:80px;text-align:right"></div>
    <div style="margin-top:14px"><button class="btn p sm" id="savecfg">Salvar configurações</button></div>
  </div></div>`;
}
function wireModelos(){
  document.querySelectorAll('.sw').forEach(s=> s.addEventListener('click', ()=> s.classList.toggle('on')));
  document.querySelectorAll('[data-savem]').forEach(b=> b.addEventListener('click', async ()=>{
    const box = b.closest('[data-mc]');
    const g = f => box.querySelector(`[data-f="${f}"]`).value;
    const upd = {
      api_model:g('api_model'),
      oc_per_1k_in:Number(g('oc_in')), oc_per_1k_out:Number(g('oc_out')),
      usd_per_mtok_in:Number(g('usd_in')), usd_per_mtok_out:Number(g('usd_out')),
      max_tokens:Math.round(Number(g('max_tokens'))||32000),
      offline_note:g('offline_note')||null,
      enabled: box.querySelector('.sw').classList.contains('on'),
      updated_at:new Date().toISOString()
    };
    const { error } = await sb.from('model_config').update(upd).eq('id', b.dataset.savem);
    if(error){ toast('Não salvou: '+error.message); return; }
    await sb.from('admin_audit').insert({admin_id:ME.id, action:'model_update', detail:{model:b.dataset.savem, ...upd}});
    toast('Modelo salvo.');
  }));
  const sc = document.getElementById('savecfg');
  sc && sc.addEventListener('click', async ()=>{
    const roll = document.querySelector('[data-set="credits_rollover"]').classList.contains('on');
    const an = Number(document.getElementById('anom').value)||3;
    await sb.from('app_settings').upsert([
      {key:'credits_rollover', value:roll, updated_at:new Date().toISOString()},
      {key:'anomaly_multiplier', value:an, updated_at:new Date().toISOString()}
    ]);
    await sb.from('admin_audit').insert({admin_id:ME.id, action:'settings_update',
      detail:{credits_rollover:roll, anomaly_multiplier:an}});
    toast('Configurações salvas.');
  });
}

/* ---------- feedback ---------- */
let FST = 'aberto';
async function viewFeed(){
  let q = sb.from('feedback').select('*').order('created_at',{ascending:false}).limit(150);
  if(FST) q = q.eq('status', FST);
  const { data } = await q;
  const KIND = {erro:'Erro',ideia:'Ideia',resposta:'Resposta ruim',cobranca:'Cobrança',geral:'Geral'};
  return `
  <div class="panel"><div class="ph">
    ${['aberto','respondido','fechado',''].map(s=>
      `<button class="btn sm ${FST===s?'p':''}" data-fs="${s}">${s||'todos'}</button>`).join('')}
    <span class="sp"></span><span class="tag">${(data||[]).length} itens</span></div>
    <div class="pb flush"><div class="tscroll">
    ${(data||[]).length ? `<table><thead><tr><th>Quando</th><th>Pessoa</th><th>Tipo</th><th>Nota</th>
      <th style="white-space:normal;min-width:280px">Mensagem</th><th>Status</th><th></th></tr></thead><tbody>
      ${data.map(f=>`<tr><td>${dt(f.created_at)}</td>
        <td><b>${esc(f.name||'—')}</b><br><span class="mail">${esc(f.email||'')}</span></td>
        <td><span class="tag ${f.kind==='erro'?'bad':(f.kind==='cobranca'?'warn':'')}">${esc(KIND[f.kind]||f.kind)}</span></td>
        <td class="num">${f.rating? '★'.repeat(f.rating) : '—'}</td>
        <td style="white-space:normal;max-width:420px">${esc(f.message)}
          ${f.admin_note?`<br><span class="mail">resposta: ${esc(f.admin_note)}</span>`:''}</td>
        <td><span class="tag ${f.status==='aberto'?'warn':'ok'}">${esc(f.status)}</span></td>
        <td><button class="btn sm" data-fb="${f.id}">Responder</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Nada por aqui.</div>'}
    </div></div></div>`;
}
function wireFeed(){
  document.querySelectorAll('[data-fs]').forEach(b=> b.addEventListener('click', ()=>{
    FST = b.dataset.fs; draw(); }));
  document.querySelectorAll('[data-fb]').forEach(b=> b.addEventListener('click', ()=>{
    dialog(`<h3>Responder feedback</h3><p>A anotação fica registrada junto do item.</p>
      <label>Anotação interna</label><textarea class="inp" id="nt" rows="4"></textarea>
      <label>Novo status</label><select class="inp" id="st">
        <option value="respondido">Respondido</option><option value="fechado">Fechado</option>
        <option value="aberto">Deixar aberto</option></select>
      <div class="row"><button class="btn" data-c>Cancelar</button><button class="btn p" data-ok>Salvar</button></div>`,
      async o=>{
        const nt = o.querySelector('#nt').value, st = o.querySelector('#st').value;
        o.remove();
        const { error } = await sb.from('feedback').update({admin_note:nt, status:st,
          answered_at:new Date().toISOString()}).eq('id', b.dataset.fb);
        if(error){ toast('Não salvou.'); return; }
        toast('Feedback atualizado.'); OV = null; draw();
      });
  }));
}

/* ---------- logs ---------- */
async function viewLogs(){
  const { data:au } = await sb.from('admin_audit').select('*').order('created_at',{ascending:false}).limit(80);
  const { data:er } = await sb.from('api_error_log').select('*').order('created_at',{ascending:false}).limit(80);
  const ids = [...new Set([...(au||[]).map(a=>a.admin_id), ...(er||[]).map(e=>e.user_id)].filter(Boolean))];
  const { data:ps } = ids.length ? await sb.from('profiles').select('id,name,email').in('id', ids) : {data:[]};
  const nm = Object.fromEntries((ps||[]).map(p=>[p.id, p.name||p.email]));
  return `
  <div class="panel"><div class="ph"><h3>Erros de API</h3><span class="sp"></span>
    <span class="tag ${(er||[]).length?'bad':'ok'}">${(er||[]).length} registros</span></div>
    <div class="pb flush"><div class="tscroll" style="max-height:330px">
    ${(er||[]).length ? `<table><thead><tr><th>Quando</th><th>Pessoa</th><th>Modelo</th><th class="num">HTTP</th>
      <th style="white-space:normal">Mensagem</th></tr></thead><tbody>
      ${er.map(e=>`<tr><td>${dt(e.created_at)}</td><td>${esc(nm[e.user_id]||'—')}</td>
        <td>${esc(e.model_id||'—')}</td><td class="num">${e.status||'—'}</td>
        <td style="white-space:normal;max-width:520px;font-family:'JetBrains Mono';font-size:.72rem;color:var(--muted)">
          ${esc((e.message||'').slice(0,260))}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Nenhum erro registrado. Ótimo sinal.</div>'}
    </div></div></div>

  <div class="panel"><div class="ph"><h3>Ações administrativas</h3></div>
    <div class="pb flush"><div class="tscroll" style="max-height:400px">
    ${(au||[]).length ? `<table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th>
      <th style="white-space:normal">Detalhe</th></tr></thead><tbody>
      ${au.map(a=>`<tr><td>${dt(a.created_at)}</td><td>${esc(nm[a.admin_id]||'—')}</td>
        <td><span class="tag acc">${esc(a.action)}</span></td>
        <td style="white-space:normal;max-width:480px;font-family:'JetBrains Mono';font-size:.7rem;color:var(--muted)">
          ${esc(JSON.stringify(a.detail||{}).slice(0,240))}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Nenhuma ação registrada ainda.</div>'}
    </div></div></div>`;
}

window.__abrir = abrirUsuario;

/* ============ BOOT ============ */
function gateMsg(html){
  const g = document.getElementById('gate');
  document.getElementById('gtxt').innerHTML = html;
  const r = g.querySelector('.ring'); if(r) r.style.display = 'none';
}

(async ()=>{
  if(!/^https?:$/.test(location.protocol)){
    gateMsg('O painel precisa de uma sessão de verdade.<br>'+
            'Abra <a href="https://orbitdual.vercel.app/admin.html" style="color:var(--accent-soft)">'+
            'orbitdual.vercel.app/admin.html</a> no navegador.');
    return;
  }
  let session = null;
  try { ({ data:{ session } } = await sb.auth.getSession()); }
  catch(e){ gateMsg('Não consegui verificar a sessão aqui.'); return; }
  if(!session){ location.replace('login.html'); return; }
  const { data:prof } = await sb.from('profiles').select('id,name,email,is_admin')
    .eq('id', session.user.id).maybeSingle();
  if(!prof || !prof.is_admin){
    gateMsg('Esta área é só para administradores.<br><a href="app.html" style="color:var(--accent-soft)">Voltar ao chat</a>');
    return;
  }
  ME = prof;
  document.getElementById('whoami').textContent = prof.name || prof.email;
  document.getElementById('shell').style.visibility = 'visible';
  const g = document.getElementById('gate'); g.classList.add('gone'); setTimeout(()=>g.remove(), 420);
  await draw();
})();

document.getElementById('reload').addEventListener('click', ()=>{ OV = null; draw(); });
document.getElementById('burger').addEventListener('click', ()=>
  document.getElementById('side').classList.toggle('open'));
</script>
